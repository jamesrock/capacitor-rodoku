<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<meta name="description" content="Sudoku simplified.">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="rodoku">
		<meta name="mobile-web-app-capable" content="yes">
		<link rel="apple-touch-icon" href="./assets/icon.png">
		<link rel="icon" sizes="192x192" href="./assets/icon.png">
		<link rel="stylesheet" type="text/css" href="./css/app.scss">
		<title>rodoku</title>
	</head>
	<body data-state="loaded">

		<div class="v-swiper">
			<div class="v-swiper-wrapper swiper-wrapper">
				<div class="swiper-slide">
					<div id="screen-expert" class="screen" data-swiper-parallax="25%"></div>
				</div>
				<div class="swiper-slide">
					<div class="h-swiper">
						<div class="h-swiper-wrapper swiper-wrapper">
							<div class="swiper-slide">
								<div id="screen-hard" class="screen" data-swiper-parallax="-25%"></div>
							</div>
							<div class="swiper-slide">
								<div id="screen-welcome" class="screen" data-swiper-parallax-opacity="0">
									<div class="welcome-body">
										<p class="swipe-up"><span>swipe up for</span> <strong>easy sudoku</strong></p>
										<p class="swipe-left"><span>swipe left for</span> <strong>regular sudoku</strong></p>
										<p class="swipe-right"><span>swipe right for</span> <strong>hard sudoku</strong></p>
										<p class="swipe-down"><span>swipe down for</span> <strong>expert sudoku</strong></p>
										<!-- <p class="mode" id="mode-toggle"><span>tap to enable</span> <strong>jigsaw mode</strong></p> -->
									</div>
								</div>
							</div>
							<div class="swiper-slide">
								<div id="screen-medium" class="screen" data-swiper-parallax="-25%"></div>
							</div>
						</div>
					</div>
				</div>
				<div class="swiper-slide">
					<div id="screen-easy" class="screen" data-swiper-parallax="25%"></div>
				</div>
			</div>
		</div>
		
		<script src="./js/app.js" type="module"></script>
	</body>
</html>
